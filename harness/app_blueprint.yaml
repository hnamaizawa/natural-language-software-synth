engine_routing:
  fretless_bass: sampler
  electric_guitar: sampler
  grand_piano: sampler
  spectral_resynth: sampler
  studio_drums: drum
  dx_style_electric_piano: fm
  default: synth
output_normalization_contract:
  instrument_velocity_trim_min: 0.82
  instrument_velocity_trim_max: 1.22
  final_leveler:
    type: dynamics_compressor
    threshold_db: -18
    knee_db: 16
    ratio: 2.5
    attack_s: 0.006
    release_s: 0.18
  master_gain_makeup_stage: forbidden
jazz_voicing_contract:
  harmony: quartal
  adjacent_interval_semitones: 5
  chord_tones: 4
pcm_fretless_contract:
  layers: [nearest_root_note, attack_noise, release_noise, slide_noise]
  controls: [sample_tone, sample_attack_mix, finger_noise_mix, release_noise_mix, slide_amount, slide_time_s, mwah_amount, sample_velocity_curve]
  generated_finger_noise_default_min: 0.68
  explicit_finger_style_noise_min: 0.82
guitar_contract:
  source: locally_generated_pcm_multisample
  amp_models: [clean, crunch, high_gain, acoustic]
  demo_styles: [rock, fusion, acoustic, jazz, blues, funk, pop, bossa]
  controls: [guitar_amp_model, guitar_amp_drive, guitar_amp_tone, guitar_amp_presence, guitar_cabinet_mix, guitar_body_tone, guitar_pick_mix, guitar_release_mix, guitar_palm_mute, guitar_sustain, guitar_chorus_mix]
  effects: [waveshaper_distortion, tone_filter, presence_shelf, cabinet_filter, chorus_delay]
  chord_strum:
    note_event_api: noteOn_noteOff_whenSeconds
    interval_seconds_min: 0.016
    interval_seconds_max: 0.028
    directions: [down, up]
grand_piano_contract:
  source: locally_generated_pcm_multisample
  layers: [string_body, hammer_attack, damper_release, soundboard_resonance]
  controls: [piano_tone, piano_hammer_mix, piano_resonance, piano_damper_noise, piano_softness, piano_sustain, piano_velocity_curve, piano_room_mix]
  root_notes: [36, 43, 48, 55, 60, 67, 72, 79, 84]
pcm_spectral_resynthesis_contract:
  instrument_model: spectral_resynth
  engine_type: sampler
  source_families: [piano, guitar, fretless]
  source_material: locally_generated_factory_pcm_only
  analysis: harmonic_projection_from_pcm
  oscillator: WebAudio_PeriodicWave
  source_morph_min: 0.0
  source_morph_max: 1.0
  harmonic_count_min: 4
  harmonic_count_max: 32
  pcm_body_mix_max: 0.65
  transient_mix_max: 1.0
  noise_mix_max: 0.35
  additional_audio_context: forbidden
  runtime_network_fetch: forbidden
  third_party_sample_load: forbidden
  note_event_api: noteOn_noteOff
  controls: [resynth_source_a, resynth_source_b, resynth_morph, resynth_harmonics, resynth_brightness, resynth_pcm_mix, resynth_transient_mix, resynth_detune_cents, resynth_noise_mix, resynth_attack_s, resynth_decay_s, resynth_sustain, resynth_release_s]
custom_sample_contract:
  storage: browser_localStorage_only
  maximum_phrases: 50
  maximum_steps_per_phrase: 128
  bpm_min: 40
  bpm_max: 240
  step_beats_min: 0.125
  step_beats_max: 8
  velocity_min: 0.05
  velocity_max: 1.0
  accepted_note_forms: [midi_0_to_127, scientific_pitch_name, rest]
  executable_user_text: forbidden
recording_workspace_contract:
  modes: [computer_keyboard, humming]
  default_mode: computer_keyboard
  tab_switching: ui_only
  new_audio_context: forbidden
  new_network_transport: forbidden
  computer_keyboard_recording_limits:
    maximum_recording_seconds: 120
    maximum_notes: 512
  humming_runtime: existing_humming_capture_contract
humming_capture_contract:
  microphone_source: navigator_media_devices_get_user_media
  microphone_audio_storage: forbidden
  microphone_audio_upload: forbidden
  analysis_location: browser_only
  audio_context: shared_existing_context
  detector: yin_style_monophonic
  minimum_frequency_hz: 75
  maximum_frequency_hz: 1000
  minimum_confidence: 0.72
  maximum_recording_seconds: 120
  maximum_notes: 512
  minimum_note_duration_ms: 90
  quantize_beats: [0.5, 0.25, 0.125]
  pitch_assist:
    modes: [major, natural_minor]
    weighted_by: [duration, pitch_confidence]
    correction: nearest_scale_pitch
    maximum_search_semitones: 3
  timing_assist:
    bpm_search_min: 60
    bpm_search_max: 180
    allowed_quantize_beats: [0.5, 0.25, 0.125]
    manual_bpm_bounds: [40, 240]
  score:
    format: browser_local_svg_staff
    source: corrected_quantized_note_events
    clefs: [treble, bass]
    time_signature: 4/4
  output: [midi_note, duration_beats, velocity, rest]
  preview_api: noteOn_noteOff
  custom_phrase_transfer: true
vst3_contract:
  browser_native_loading: forbidden
  bridge_server_bind: 127.0.0.1
  bridge_transport: same_origin_http_to_python_then_stdio_to_native_host
  native_host_process: separate_windows_executable
  standard_scan_roots: [COMMONPROGRAMFILES/VST3, LOCALAPPDATA/Programs/Common/VST3]
  user_scan_roots: bounded_local_paths_from_ui
  optional_scan_roots_env: NLSS_VST3_PATHS
  optional_host_path_env: NLSS_VST3_HOST
  plugin_selection: scanned_plugin_id_only
  note_min: 0
  note_max: 127
  melodic_midi_channel_zero_based: 0
  drum_midi_channel_zero_based: 9
  selectable_midi_channels_zero_based: [0, 9]
  automatic_channel_rule: drum_9_otherwise_0
  velocity_min: 0.0
  velocity_max: 1.0
  parameter_normalized_min: 0.0
  parameter_normalized_max: 1.0
  maximum_parameter_controls_in_browser: 160
  processing_order: [configure_bus_arrangements, select_and_activate_main_buses, prepare_process_buffers, setup_processing, set_active, set_processing]
  live_note_event_flag: kIsLive
  output_bus: active_main_output_bus
  event_input_bus: active_main_event_input_bus
  diagnostics: [note_on_queued, note_off_queued, events_delivered, process_calls, process_failures, last_output_peak, max_output_peak]
  zero_output_guidance: [load_plugin_kit_or_preset, check_master_volume, try_midi_channel_1_or_10]
  native_audio_test_tone_hz: 440
  native_editor:
    process: same_native_host_process
    plugin_instance: same_loaded_vst3_instance
    view_factory: IEditController_createView_kEditor
    windows_parent: HWND
    frame_interface: IPlugFrame
    parameter_bridge: IComponentHandler
    browser_embedding: forbidden
  reload_focus_restore: required
  vst3_sdk:
    repository: steinbergmedia/vst3sdk
    version: 3.8.1
    commit: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
  audio_backend:
    library: miniaudio
    version: 0.11.25
    commit: 9634bedb5b5a2ca38c1ee7108a9358a4e233f14d
  route_sources: [onscreen_keyboard, onscreen_drum_pad, computer_keyboard, computer_keyboard_recording_playback, web_midi, sample_performance, humming_preview]
timbre_variation_contract:
  runtime_network_fetch: forbidden
  third_party_preset_copy: forbidden
  third_party_sample_load: forbidden
  validation: existing_patch_validator
  legacy_engine: synth
  preferred_engine: pcm_spectral_resynthesis
  source_families: [piano, guitar, fretless]
  archetypes: [string_ensemble, synth_brass, airy_choir_pad, retro_polysynth, resonant_acid_bass, analog_synth_keys, bell, pluck, organ, lead, pad, bass]
  descriptor_modifiers: [warm, bright, dark, wide, thin, dry, spacious, metallic, woody, airy, percussive, smooth, short, long]
drum_contract:
  canonical_notes:
    kick: 36
    snare: 38
    closed_hat: 42
    open_hat: 46
    low_tom: 45
    mid_tom: 48
    high_tom: 50
    crash: 49
    ride: 51
fm_contract:
  controls: [fm_mod_index, fm_brightness, fm_ratio_1, fm_ratio_2, fm_decay_s, fm_release_s, fm_chorus_mix]
sequencer_contract:
  note_on: "noteOn(midiNote, velocity, whenSeconds=0)"
  note_off: "noteOff(midiNote, whenSeconds=0)"
  set_patch: "setPatch(validatedPatch)"
