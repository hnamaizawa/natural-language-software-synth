schema_version: '1.0'
blueprint_name: natural-language-software-synth
blueprint_version: 0.7.0
canonical_project: natural-language-software-synth
purpose: >-
  Generate and play local-first multi-engine instrument patches from natural-language
  descriptions. Preserve all existing synth/sampler/drum/FM, performance, editing, output,
  microphone and safety contracts while adding automatic humming key/timing correction,
  staff notation, and a separately built Windows native VST3 instrument host.
required_capabilities:
- natural_language_patch_generation
- deterministic_offline_prompt_fallback
- validated_patch_schema
- browser_web_audio_polyphonic_engine
- pcm_fretless_bass_engine
- pcm_fretless_articulation_layers
- enhanced_fretless_finger_noise
- pcm_electric_guitar_engine
- guitar_amp_distortion_stage
- guitar_amp_model_controls
- guitar_chord_strum_timing
- guitar_rock_sample_performance
- guitar_fusion_sample_performance
- guitar_acoustic_sample_performance
- guitar_jazz_sample_performance
- pcm_grand_piano_engine
- grand_piano_hammer_articulation
- grand_piano_damper_articulation
- grand_piano_resonance_controls
- grand_piano_sample_performance
- pcm_studio_drum_engine
- dx_style_fm_electric_piano_engine
- adaptive_piano_or_drum_performance_surface
- drum_surface_must_persist_for_drum_patch
- computer_keyboard_performance
- onscreen_keyboard_performance
- onscreen_drum_pad_performance
- optional_web_midi_input
- gm_style_drum_note_mapping
- current_patch_sample_performance
- instrument_model_specific_sample_performance
- expanded_sample_performance_genres
- user_registered_sample_performance
- local_custom_sample_phrase_storage
- custom_sample_phrase_delete
- microphone_humming_melody_capture
- monophonic_yin_pitch_detection
- humming_midi_like_note_event_capture
- humming_note_duration_and_velocity_capture
- humming_quantization
- humming_key_scale_inference
- humming_scale_snap_correction
- humming_automatic_tempo_grid_estimation
- humming_automatic_quantization
- humming_staff_notation_svg
- humming_preview_with_current_patch
- humming_to_custom_phrase_transfer
- fretless_sample_performance
- fretless_jazz_walking_sample_performance
- fm_ep_sample_performance
- fm_ep_jazz_sample_performance
- drum_half_time_shuffle_sample_performance
- drum_straight_sample_performance
- drum_jazz_swing_sample_performance
- synth_jazz_sample_performance
- quartal_jazz_chord_voicings
- perceived_output_level_normalization
- bounded_instrument_level_trim
- final_output_dynamics_leveler
- graphical_patch_parameter_editor
- continuous_graphical_parameter_editing
- engine_specific_parameter_controls
- parameter_reset_to_generated_patch
- patch_json_save_load
- stable_note_event_contract
- future_sequencer_adapter_boundary
- future_native_vst3_host_boundary
- windows_native_vst3_host
- vst3_standard_path_scan
- vst3_instrument_load
- vst3_note_event_routing
- vst3_parameter_enumeration_and_editing
- vst3_localhost_bridge
- local_windows_setup
- regression_test_harness
non_negotiable_invariants:
- generated_text_must_never_be_executed_as_code
- generated_patch_must_be_schema_validated_and_clamped
- graphical_parameter_edits_must_be_validated_and_clamped
- graphical_slider_input_must_not_rebuild_control_during_drag
- audio_context_must_start_only_after_user_gesture
- all_engines_must_share_single_audio_context
- all_web_audio_engines_must_share_single_audio_context
- microphone_capture_must_use_existing_audio_context
- microphone_audio_must_not_be_persisted_or_uploaded
- humming_capture_must_be_monophonic_and_bounded
- humming_preview_must_use_same_note_on_note_off_contract
- humming_note_data_must_be_quantized_to_bounded_custom_phrase_values
- humming_pitch_correction_must_snap_only_to_inferred_or_selected_scale
- humming_timing_quantization_must_be_bounded
- humming_score_must_be_derived_from_corrected_note_events
- master_gain_must_be_hard_limited
- output_level_normalization_must_not_bypass_master_gain_limit
- output_level_runtime_must_use_existing_audio_context
- instrument_level_trim_must_be_bounded
- jazz_chord_samples_must_use_quartal_voicing
- polyphony_must_be_bounded
- oscillator_frequency_must_be_derived_from_valid_midi_note
- sequencer_must_use_same_note_on_note_off_contract_as_live_playing
- sample_performance_must_use_same_note_on_note_off_contract_as_live_playing
- sample_performance_must_match_explicit_instrument_model
- expanded_sample_library_must_use_note_event_contract
- custom_sample_phrases_must_remain_local_browser_data
- custom_sample_phrase_values_must_be_bounded
- custom_sample_phrases_must_not_execute_user_text
- guitar_detection_must_require_explicit_electric_guitar_model
- guitar_chord_sample_performance_must_apply_strum_timing
- drum_patch_must_keep_drum_surface_and_drum_keymap
- pcm_sampler_must_use_audio_buffer_source_nodes
- pcm_factory_buffers_must_not_embed_third_party_artist_recordings
- guitar_pcm_must_use_existing_audio_context
- guitar_amp_parameters_must_be_schema_validated_and_clamped
- guitar_sample_performance_must_use_note_event_contract
- grand_piano_pcm_must_use_existing_audio_context
- grand_piano_parameters_must_be_schema_validated_and_clamped
- drum_pad_and_sample_must_use_note_event_contract
- pcm_and_fm_parameters_must_be_schema_validated_and_clamped
- saved_user_patches_must_not_be_copied_into_generated_apps
- external_llm_credentials_must_not_be_required_for_offline_mode
- vst3_binary_must_never_be_loaded_in_browser_process
- vst3_bridge_must_bind_through_existing_local_http_server
- vst3_plugin_load_must_be_limited_to_scanned_local_plugin_ids
- vst3_note_values_must_be_bounded
- vst3_parameter_values_must_be_normalized_and_bounded
- vst3_native_host_must_run_as_separate_process
- vst3_dependencies_must_be_pinned
- eval_and_dynamic_script_injection_forbidden
required_files:
- AGENTS.md
- HARNESS.md
- README.md
- server.py
- pyproject.toml
- setup_windows.cmd
- start_synth.cmd
- check_harness.cmd
- build_vst3_host.cmd
- harness/app_blueprint.yaml
- scripts/harness_check.py
- src/ai_synth/patch.py
- src/ai_synth/prompt_engine.py
- web/index.html
- web/app.js
- web/patch_editor_runtime.js
- web/guitar_runtime.js
- web/piano_runtime.js
- web/instrument_performance_runtime.js
- web/performance_library_runtime.js
- web/output_level_runtime.js
- web/humming_runtime.js
- web/vst3_runtime.js
- web/performance_editor.css
- web/style.css
- native/vst3_host/CMakeLists.txt
- native/vst3_host/src/main.cpp
runtime_state_exclusions:
- .env
- .venv
- .git
- .pytest_cache
- __pycache__
- data/presets
- generated
- native/vst3_host/build
- native/vst3_host/out
acceptance_commands:
- setup_windows.cmd
- check_harness.cmd
- start_synth.cmd
- build_vst3_host.cmd
ui_requirements:
  prompt_to_patch: true
  onscreen_keyboard: true
  onscreen_drum_pads: true
  adaptive_instrument_surface: true
  computer_keyboard: true
  midi_input_optional: true
  microphone_humming_capture: true
  humming_live_pitch_display: true
  humming_record_start_stop: true
  humming_auto_key_correction_default: true
  humming_auto_timing_default: true
  humming_key_result_display: true
  humming_timing_result_display: true
  humming_score_svg: true
  humming_preview: true
  humming_transfer_to_custom_phrase: true
  humming_quantize_values: [0.5, 0.25, 0.125]
  vst3_scan: true
  vst3_select_and_load: true
  vst3_route_toggle: true
  vst3_parameter_editor: true
  sample_performance: true
  instrument_model_specific_sample_performance: true
  expanded_sample_performance_genres: true
  custom_sample_phrase_registration: true
  custom_sample_phrase_delete: true
  custom_sample_phrase_storage: localStorage
  sample_performance_types: [synth_melody, synth_chords, synth_jazz, synth_pop, synth_edm, synth_ambient, fretless_phrase, fretless_jazz, fretless_funk, fretless_fusion, fretless_ballad, ep_chords, ep_jazz, ep_citypop, ep_fusion, ep_ballad, piano_classical, piano_jazz, piano_ballad, piano_pop, piano_boogie, drum_shuffle, drum_straight, drum_jazz, drum_rock, drum_funk, drum_fusion, drum_bossa, guitar_rock, guitar_fusion, guitar_acoustic, guitar_jazz, guitar_blues, guitar_funk, guitar_pop, guitar_bossa]
  sample_performance_stop: true
  graphical_patch_parameter_editor: true
  continuous_slider_editing: true
  engine_specific_parameter_controls: true
  guitar_amp_graphical_controls: true
  grand_piano_graphical_controls: true
  reset_to_generated_patch: true
  patch_json_export_import: true
engine_routing:
  fretless_bass: sampler
  electric_guitar: sampler
  grand_piano: sampler
  studio_drums: drum
  dx_style_electric_piano: fm
  default: synth
output_normalization_contract:
  instrument_velocity_trim_min: 0.82
  instrument_velocity_trim_max: 1.22
  final_leveler:
    type: dynamics_compressor
    threshold_db: -18
    knee_db: 16
    ratio: 2.5
    attack_s: 0.006
    release_s: 0.18
  master_gain_makeup_stage: forbidden
jazz_voicing_contract:
  harmony: quartal
  adjacent_interval_semitones: 5
  chord_tones: 4
pcm_fretless_contract:
  layers: [nearest_root_note, attack_noise, release_noise, slide_noise]
  controls: [sample_tone, sample_attack_mix, finger_noise_mix, release_noise_mix, slide_amount, slide_time_s, mwah_amount, sample_velocity_curve]
  generated_finger_noise_default_min: 0.68
  explicit_finger_style_noise_min: 0.82
guitar_contract:
  source: locally_generated_pcm_multisample
  amp_models: [clean, crunch, high_gain, acoustic]
  demo_styles: [rock, fusion, acoustic, jazz, blues, funk, pop, bossa]
  controls: [guitar_amp_model, guitar_amp_drive, guitar_amp_tone, guitar_amp_presence, guitar_cabinet_mix, guitar_body_tone, guitar_pick_mix, guitar_release_mix, guitar_palm_mute, guitar_sustain, guitar_chorus_mix]
  effects: [waveshaper_distortion, tone_filter, presence_shelf, cabinet_filter, chorus_delay]
  chord_strum:
    note_event_api: noteOn_noteOff_whenSeconds
    interval_seconds_min: 0.016
    interval_seconds_max: 0.028
    directions: [down, up]
grand_piano_contract:
  source: locally_generated_pcm_multisample
  layers: [string_body, hammer_attack, damper_release, soundboard_resonance]
  controls: [piano_tone, piano_hammer_mix, piano_resonance, piano_damper_noise, piano_softness, piano_sustain, piano_velocity_curve, piano_room_mix]
  root_notes: [36, 43, 48, 55, 60, 67, 72, 79, 84]
custom_sample_contract:
  storage: browser_localStorage_only
  maximum_phrases: 50
  maximum_steps_per_phrase: 128
  bpm_min: 40
  bpm_max: 240
  step_beats_min: 0.125
  step_beats_max: 8
  velocity_min: 0.05
  velocity_max: 1.0
  accepted_note_forms: [midi_0_to_127, scientific_pitch_name, rest]
  executable_user_text: forbidden
humming_capture_contract:
  microphone_source: navigator_media_devices_get_user_media
  microphone_audio_storage: forbidden
  microphone_audio_upload: forbidden
  analysis_location: browser_only
  audio_context: shared_existing_context
  detector: yin_style_monophonic
  minimum_frequency_hz: 75
  maximum_frequency_hz: 1000
  minimum_confidence: 0.72
  maximum_recording_seconds: 120
  maximum_notes: 512
  minimum_note_duration_ms: 90
  quantize_beats: [0.5, 0.25, 0.125]
  pitch_assist:
    modes: [major, natural_minor]
    weighted_by: [duration, pitch_confidence]
    correction: nearest_scale_pitch
    maximum_search_semitones: 3
  timing_assist:
    bpm_search_min: 60
    bpm_search_max: 180
    allowed_quantize_beats: [0.5, 0.25, 0.125]
    manual_bpm_bounds: [40, 240]
  score:
    format: browser_local_svg_staff
    source: corrected_quantized_note_events
    clefs: [treble, bass]
    time_signature: 4/4
  output: [midi_note, duration_beats, velocity, rest]
  preview_api: noteOn_noteOff
  custom_phrase_transfer: true
vst3_contract:
  browser_native_loading: forbidden
  bridge_server_bind: 127.0.0.1
  bridge_transport: same_origin_http_to_python_then_stdio_to_native_host
  native_host_process: separate_windows_executable
  standard_scan_roots: [COMMONPROGRAMFILES/VST3, LOCALAPPDATA/Programs/Common/VST3]
  optional_scan_roots_env: NLSS_VST3_PATHS
  optional_host_path_env: NLSS_VST3_HOST
  plugin_selection: scanned_plugin_id_only
  note_min: 0
  note_max: 127
  velocity_min: 0.0
  velocity_max: 1.0
  parameter_normalized_min: 0.0
  parameter_normalized_max: 1.0
  maximum_parameter_controls_in_browser: 160
  vst3_sdk:
    repository: steinbergmedia/vst3sdk
    version: 3.8.1
    commit: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
  audio_backend:
    library: miniaudio
    version: 0.11.25
    commit: 9634bedb5b5a2ca38c1ee7108a9358a4e233f14d
  route_sources: [onscreen_keyboard, computer_keyboard, web_midi, sample_performance, humming_preview]
drum_contract:
  canonical_notes:
    kick: 36
    snare: 38
    closed_hat: 42
    open_hat: 46
    low_tom: 45
    mid_tom: 48
    high_tom: 50
    crash: 49
    ride: 51
fm_contract:
  controls: [fm_mod_index, fm_brightness, fm_ratio_1, fm_ratio_2, fm_decay_s, fm_release_s, fm_chorus_mix]
sequencer_contract:
  note_on: "noteOn(midiNote, velocity, whenSeconds=0)"
  note_off: "noteOff(midiNote, whenSeconds=0)"
  set_patch: "setPatch(validatedPatch)"
