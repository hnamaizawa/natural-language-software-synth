schema_version: '1.0'
blueprint_name: natural-language-software-synth
blueprint_version: 0.4.1
canonical_project: natural-language-software-synth
purpose: >-
  Generate and play local-first multi-engine instrument patches from natural-language
  descriptions. Support subtractive synthesis, PCM-style fretless bass, PCM-style electric
  guitar with bounded amp/cabinet distortion, PCM-style drums, and FM electric piano while
  keeping every generated or edited patch validated and bounded.
required_capabilities:
- natural_language_patch_generation
- deterministic_offline_prompt_fallback
- validated_patch_schema
- browser_web_audio_polyphonic_engine
- pcm_fretless_bass_engine
- pcm_fretless_articulation_layers
- pcm_electric_guitar_engine
- guitar_amp_distortion_stage
- guitar_amp_model_controls
- guitar_rock_sample_performance
- guitar_fusion_sample_performance
- guitar_acoustic_sample_performance
- guitar_jazz_sample_performance
- pcm_studio_drum_engine
- dx_style_fm_electric_piano_engine
- adaptive_piano_or_drum_performance_surface
- drum_surface_must_persist_for_drum_patch
- computer_keyboard_performance
- onscreen_keyboard_performance
- onscreen_drum_pad_performance
- optional_web_midi_input
- gm_style_drum_note_mapping
- current_patch_sample_performance
- instrument_model_specific_sample_performance
- fretless_sample_performance
- fretless_jazz_walking_sample_performance
- fm_ep_sample_performance
- fm_ep_jazz_sample_performance
- drum_half_time_shuffle_sample_performance
- drum_straight_sample_performance
- drum_jazz_swing_sample_performance
- synth_jazz_sample_performance
- graphical_patch_parameter_editor
- continuous_graphical_parameter_editing
- engine_specific_parameter_controls
- parameter_reset_to_generated_patch
- patch_json_save_load
- stable_note_event_contract
- future_sequencer_adapter_boundary
- local_windows_setup
- regression_test_harness
non_negotiable_invariants:
- generated_text_must_never_be_executed_as_code
- generated_patch_must_be_schema_validated_and_clamped
- graphical_parameter_edits_must_be_validated_and_clamped
- graphical_slider_input_must_not_rebuild_control_during_drag
- audio_context_must_start_only_after_user_gesture
- all_engines_must_share_single_audio_context
- master_gain_must_be_hard_limited
- polyphony_must_be_bounded
- oscillator_frequency_must_be_derived_from_valid_midi_note
- sequencer_must_use_same_note_on_note_off_contract_as_live_playing
- sample_performance_must_use_same_note_on_note_off_contract_as_live_playing
- sample_performance_must_match_explicit_instrument_model
- guitar_detection_must_require_explicit_electric_guitar_model
- drum_patch_must_keep_drum_surface_and_drum_keymap
- pcm_sampler_must_use_audio_buffer_source_nodes
- pcm_factory_buffers_must_not_embed_third_party_artist_recordings
- guitar_pcm_must_use_existing_audio_context
- guitar_amp_parameters_must_be_schema_validated_and_clamped
- guitar_sample_performance_must_use_note_event_contract
- drum_pad_and_sample_must_use_note_event_contract
- pcm_and_fm_parameters_must_be_schema_validated_and_clamped
- saved_user_patches_must_not_be_copied_into_generated_apps
- external_llm_credentials_must_not_be_required_for_offline_mode
- eval_and_dynamic_script_injection_forbidden
required_files:
- AGENTS.md
- HARNESS.md
- README.md
- server.py
- pyproject.toml
- setup_windows.cmd
- start_synth.cmd
- check_harness.cmd
- harness/app_blueprint.yaml
- scripts/harness_check.py
- src/ai_synth/patch.py
- src/ai_synth/prompt_engine.py
- web/index.html
- web/app.js
- web/patch_editor_runtime.js
- web/guitar_runtime.js
- web/instrument_performance_runtime.js
- web/style.css
runtime_state_exclusions:
- .env
- .venv
- .git
- .pytest_cache
- __pycache__
- data/presets
- generated
acceptance_commands:
- setup_windows.cmd
- check_harness.cmd
- start_synth.cmd
ui_requirements:
  prompt_to_patch: true
  onscreen_keyboard: true
  onscreen_drum_pads: true
  adaptive_instrument_surface: true
  computer_keyboard: true
  midi_input_optional: true
  sample_performance: true
  instrument_model_specific_sample_performance: true
  sample_performance_types: [synth_melody, synth_chords, synth_jazz, fretless_phrase, fretless_jazz, ep_chords, ep_jazz, drum_shuffle, drum_straight, drum_jazz, guitar_rock, guitar_fusion, guitar_acoustic, guitar_jazz]
  sample_performance_stop: true
  graphical_patch_parameter_editor: true
  continuous_slider_editing: true
  engine_specific_parameter_controls: true
  guitar_amp_graphical_controls: true
  reset_to_generated_patch: true
  patch_json_export_import: true
engine_routing:
  fretless_bass: sampler
  electric_guitar: sampler
  studio_drums: drum
  dx_style_electric_piano: fm
  default: synth
pcm_fretless_contract:
  layers: [nearest_root_note, attack_noise, release_noise, slide_noise]
  controls: [sample_tone, sample_attack_mix, finger_noise_mix, release_noise_mix, slide_amount, slide_time_s, mwah_amount, sample_velocity_curve]
guitar_contract:
  source: locally_generated_pcm_multisample
  amp_models: [clean, crunch, high_gain, acoustic]
  demo_styles: [rock, fusion, acoustic, jazz]
  controls: [guitar_amp_model, guitar_amp_drive, guitar_amp_tone, guitar_amp_presence, guitar_cabinet_mix, guitar_body_tone, guitar_pick_mix, guitar_release_mix, guitar_palm_mute, guitar_sustain, guitar_chorus_mix]
  effects: [waveshaper_distortion, tone_filter, presence_shelf, cabinet_filter, chorus_delay]
drum_contract:
  canonical_notes:
    kick: 36
    snare: 38
    closed_hat: 42
    open_hat: 46
    low_tom: 45
    mid_tom: 48
    high_tom: 50
    crash: 49
    ride: 51
fm_contract:
  controls: [fm_mod_index, fm_brightness, fm_ratio_1, fm_ratio_2, fm_decay_s, fm_release_s, fm_chorus_mix]
sequencer_contract:
  note_on: "noteOn(midiNote, velocity, whenSeconds=0)"
  note_off: "noteOff(midiNote, whenSeconds=0)"
  set_patch: "setPatch(validatedPatch)"
