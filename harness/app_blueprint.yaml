schema_version: '1.0'
blueprint_name: natural-language-software-synth
blueprint_version: 0.7.2
canonical_project: natural-language-software-synth
purpose: >-
  Generate and play local-first multi-engine instrument patches from natural-language
  descriptions. Preserve all existing synth/sampler/drum/FM, performance, editing, output,
  microphone and safety contracts while supporting automatic humming key/timing correction,
  staff notation, a diagnosable Windows native VST3 instrument host, same-instance native
  VST3 editor windows, bounded expanded natural-language timbre archetypes, PCM-derived
  spectral resynthesis, and a workflow-guided UI with one unified recording workspace for
  computer-keyboard and humming capture.
