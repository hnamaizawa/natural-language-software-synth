name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/

      - name: Run harness checks
        run: python scripts/harness_check.py

  native-vst3-build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native VST3 host
        shell: cmd
        run: build_vst3_host.cmd

      - name: Verify VST3 host executable
        shell: pwsh
        run: |
          $exe = "native/vst3_host/build/Release/nlss_vst3_host.exe"
          if (-not (Test-Path $exe)) { throw "VST3 host executable was not produced: $exe" }
