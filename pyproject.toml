[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-software-synth"
version = "0.6.0"
description = "Local-first multi-engine software synthesizer with microphone humming-to-MIDI-like melody capture, PCM grand piano, stronger fretless articulation, guitar strum timing, local custom sample phrases, expanded performance genres, output normalization, PCM guitar amp distortion, PCM drums, FM EP, and graphical patch editing."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
