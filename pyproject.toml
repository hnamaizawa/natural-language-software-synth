[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-software-synth"
version = "0.7.2"
description = "Local-first multi-engine software synthesizer with automatic humming correction, SVG score rendering, diagnosable Windows VST3 hosting, PCM instruments, FM EP, custom performances, and graphical patch editing."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
